<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sunwaves Uganda Ltd – Precision in Every Injection</title>
    <meta name="description"
        content="Sunwaves Uganda Ltd delivers WHO-GMP certified injectable pharmaceutical solutions with unmatched quality, safety and precision for better patient outcomes worldwide." />

    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Outfit:wght@400;800&display=swap"
        rel="stylesheet" />

    <!-- ── Section CSS Files ───────────────────────────── -->
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/navbar.css" />
    <link rel="stylesheet" href="css/hero.css" />
    <link rel="stylesheet" href="css/statement.css" />
    <link rel="stylesheet" href="css/stacking-cards.css" />
    <link rel="stylesheet" href="css/mission.css" />
    <link rel="stylesheet" href="css/testimonials.css" />
    <link rel="stylesheet" href="css/footer.css" />
</head>

<body>

    <!-- ── Section Placeholders (loaded by include.js) ── -->
    <div data-include="sections/navbar.html"></div>
    <div data-include="sections/hero.html"></div>
    <div data-include="sections/statement.html"></div>
    <div data-include="sections/stacking-cards.html"></div>
    <div data-include="sections/mission.html"></div>
    <div data-include="sections/testimonials.html"></div>
    <div data-include="sections/footer.html"></div>

    <!-- ── External Libraries ────────────────────────── -->
    <script src="https://unpkg.com/lenis@1.1.14/dist/lenis.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>

    <!-- ── Section Loader ────────────────────────────── -->
    <!--
        include.js fetches each section's HTML partial and injects it
        into the matching [data-include] placeholder. After all sections
        load, script.js and testimonials.js run so their DOM queries
        find the elements they need.
    -->
    <script src="include.js"></script>

</body>

</html>
